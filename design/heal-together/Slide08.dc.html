    <span style="display: inline-flex; align-items: center; font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 30px; line-height: 1; color: #5c2b2e; background: #ffffff; border: 1px solid #eccdc4; border-radius: 999px; padding: 20px 30px; white-space: nowrap">Maybe it’s shame.</span>

    <span style="display: inline-flex; align-items: center; font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 30px; line-height: 1; color: #5c2b2e; background: #ffffff; border: 1px solid #eccdc4; border-radius: 999px; padding: 20px 30px; white-space: nowrap">Maybe it’s grief.</span>
    <span style="display: inline-flex; align-items: center; font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 30px; line-height: 1; color: #5c2b2e; background: #ffffff; border: 1px solid #eccdc4; border-radius: 999px; padding: 20px 30px; white-space: nowrap">Maybe it’s disappointment.</span>

</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
  <span style="font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1; letter-spacing: 0.16em; text-transform: uppercase; color: #b14d2d">Celebration Church</span>
  <span style="font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1; letter-spacing: 0.16em; color: #b14d2d">08 / 10</span>
