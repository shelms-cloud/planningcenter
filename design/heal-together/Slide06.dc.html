<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    a { color: #3857a8; text-decoration: none; }
    a:hover { color: #2c4585; }
  </style>
</helmet>
<div style="width: 1080px; height: 1080px; background: #1d242b; padding: 96px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden">
<div style="display: flex; align-items: center; gap: 16px">
  <span style="display: block; width: 40px; height: 2px; background: #f1be96"></span>
  <span style="font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 21px; line-height: 1; letter-spacing: 0.22em; text-transform: uppercase; color: #f1be96">Scripture</span>
</div>
<div style="display: flex; flex-direction: column; gap: 36px">
  <div style="display: flex; flex-direction: column; gap: 6px">
<p style="font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-weight: 400; font-size: 34px; line-height: 1.4; letter-spacing: 0; color: #b8c0cc; margin: 0; text-wrap: pretty">We go to God for forgiveness.</p>
<p style="font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 34px; line-height: 1.4; letter-spacing: 0; color: #f1be96; margin: 0; text-wrap: pretty">But healing? James tells us to go to each other.</p>
  </div>
<span style="display: block; height: 1px; background: #3a434e"></span>
<p style="font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-style: normal; font-size: 62px; line-height: 1.24; letter-spacing: -0.015em; color: #fcfaf6; margin: 0; text-wrap: pretty">“Therefore confess your sins to each other and pray for each other so that you may be healed.”</p>
<p style="font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 24px; line-height: 1; letter-spacing: 0.14em; color: #f1be96; margin: 0; text-wrap: pretty">— James 5:16</p>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
  <span style="font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1; letter-spacing: 0.16em; text-transform: uppercase; color: #8893a6">Celebration Church</span>
  <span style="font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1; letter-spacing: 0.16em; color: #8893a6">06 / 10</span>
</div>
</div>
</x-dc>
